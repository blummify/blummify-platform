name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

  deploy-prod:
    name: SSH deploy to VPS
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            cd ${{ secrets.VPS_APP_PATH }}

            PREV_COMMIT=$(git rev-parse HEAD)

            rollback() {
              echo "Deploy failed — rolling back to $PREV_COMMIT"
              git reset --hard $PREV_COMMIT
              npm ci --prefer-offline
              npm run build
              pm2 reload blummify-platform
              pm2 save
              exit 1
            }

            git pull origin main       || rollback
            npm ci                     || rollback
            npm run build              || rollback
            pm2 reload blummify-platform || rollback
            pm2 save

            # Health check — give the process 5s to settle then verify it responds
            sleep 5
            curl -sf https://blummify.com > /dev/null || rollback

      - name: Notify success
        if: success()
        run: |
          curl -s -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer ${{ secrets.RESEND_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "from": "deploy@blummify.com",
              "to": ["oseijoel6111@gmail.com"],
              "subject": "Blummify deployed successfully",
              "html": "<p><strong>Deployment successful</strong></p><p>Commit: <code>${{ github.sha }}</code></p><p>Pushed by: ${{ github.actor }}</p><p><a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">View run</a></p>"
            }'

      - name: Notify failure
        if: failure()
        run: |
          curl -s -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer ${{ secrets.RESEND_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "from": "deploy@blummify.com",
              "to": ["oseijoel6111@gmail.com"],
              "subject": "Blummify deployment failed — rolled back",
              "html": "<p><strong>Deployment failed and was rolled back</strong></p><p>Commit: <code>${{ github.sha }}</code></p><p>Pushed by: ${{ github.actor }}</p><p><a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">View logs</a></p>"
            }'
